[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fcd"
dynamic = ["version"]
description = "Factorized contrastive decoding: contrast the directive and the passage separately, each with its own strength"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }, { name = "Chanjun Park" }, { name = "Heuiseok Lim" }]
keywords = ["contrastive-decoding", "knowledge-conflicts", "context-faithfulness", "retrieval-augmented-generation",
            "question-answering", "llm-decoding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The prompts, the methods and the scoring need only the standard library; the tables need numpy.
# Decoding with a model and loading the tasks need the run extra.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
run = ["torch>=2.4", "transformers>=4.56", "datasets>=2.19", "accelerate>=0.33", "huggingface_hub>=0.24", "pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
fcd = "fcd.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/FCD"
Issues = "https://github.com/js-lee-AI/FCD/issues"

[tool.setuptools.dynamic]
version = { attr = "fcd.__version__" }

[tool.setuptools.packages.find]
include = ["fcd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
